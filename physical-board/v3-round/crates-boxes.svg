<title>Pastry Pirates — V3 · The Round Table — Cargo crates (4)</title>
<desc>One open crate per captain, 44 × 30 × 18 mm in 3 mm ply: three slats a side with real gaps cut between them, solid corner posts, box joints. Tokens stand on edge in it, icons showing — cargo is public, as in the game. Paint to mark whose it is. Units: mm. 25 mm squares, 5.9 mm material. KERF-COMPENSATED: cut lines offset 0.1375 mm away from the kept wood (kerf 0.275 mm) — cut exactly on the line. RASTER = black fill (engrave), CUT = red hairline (cut). Generated by physical-board/generate.mjs.</desc>
