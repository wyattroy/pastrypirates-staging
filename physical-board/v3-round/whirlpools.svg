<title>Pastry Pirates — V3 · The Round Table — Whirlpools (4)</title>
<desc>One square each in 3 mm, 0.4 mm clearance, the game's whirlpool art (assets/trade-swirl.png) traced and engraved. Drop them on any four trade-wind squares — a ship carried by the current gets off at the next whirlpool. Units: mm. 25 mm squares, 5.9 mm material. KERF-COMPENSATED: cut lines offset 0.1375 mm away from the kept wood (kerf 0.275 mm) — cut exactly on the line. RASTER = black fill (engrave), CUT = red hairline (cut). Generated by physical-board/generate.mjs.</desc>
